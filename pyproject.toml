[project]
name = "offprint"
version = "0.1.0"
description = "Turn research papers into clean, reflowable Kindle books."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
offprint = "offprint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
# prototype/ is a frozen reference (see CLAUDE.md).
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
